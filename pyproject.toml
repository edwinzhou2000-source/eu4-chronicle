[project]
name = "eu4-chronicle"
version = "0.1.0"
description = "EU4 本机存档 Diff 与多角色战报合成（白银段）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
eu4-chronicle = "eu4_chronicle.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eu4_chronicle"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
